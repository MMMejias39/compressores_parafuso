[workspace]
members = [
    "crates/sim_core",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["Digital Twin Compressores"]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
