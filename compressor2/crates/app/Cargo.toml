[package]
name = "compressor2"
version.workspace = true
edition.workspace = true

[dependencies]
sim_core = { path = "../sim_core" }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
